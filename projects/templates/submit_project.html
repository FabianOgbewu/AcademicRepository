<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academic Repository - Submit Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 600;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 200px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background-color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Submit New Project Abstract</h2>
        
        <form method="POST">
            <!-- Mandatory Django security tag -->
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title">Project Title</label>
                <input type="text" id="title" name="title" placeholder="Enter the full title of your research..." required>
            </div>
            
            <div class="form-group">
                <label for="category">Academic Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>-- Select a Department --</option>
                    <option value="CS">Computer Science</option>
                    <option value="ENG">Engineering</option>
                    <option value="BUS">Business</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="abstract">Project Abstract</label>
                <textarea id="abstract" name="abstract" placeholder="Type or paste your full project abstract here..." required></textarea>
            </div>
            
            <div class="btn-group">
                <!-- Takes the student back to their workspace safely -->
                <a href="{% url 'student_dashboard' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Abstract to Database</button>
            </div>
        </form>
    </div>

</body>
</html>
